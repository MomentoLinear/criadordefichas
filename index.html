<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Criação de Personagem - RPG</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #121212;
      color: #ffffff;
      padding: 15px;
      margin: 0;
    }

    /* Painel Resumo Fixo no Topo */
    #summary-header {
      position: sticky;
      top: 0;
      background: #1e1e1e;
      border: 1px solid #333;
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 20px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
      z-index: 100;
    }
    #summary-header h3 {
      margin: 0 0 8px 0;
      font-size: 13px;
      color: #ffca28;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .summary-grid {
      display: flex;
      justify-content: space-between;
      gap: 6px;
      font-size: 12px;
    }
    .summary-item {
      background: #2a2a2a;
      padding: 6px 8px;
      border-radius: 6px;
      flex: 1;
      text-align: center;
    }
    .summary-item span {
      display: block;
      font-size: 10px;
      color: #aaa;
    }
    .summary-item strong {
      color: #4CAF50;
      font-size: 12px;
    }

    /* Passos / Telas */
    .step-title {
      color: #ffca28;
      text-align: center;
      margin-bottom: 15px;
    }
    .step-box {
      background: #181818;
      border: 1px solid #2a2a2a;
      padding: 15px;
      border-radius: 8px;
    }
    label {
      font-weight: bold;
      display: block;
      margin-bottom: 8px;
      color: #ddd;
    }
    select, input {
      width: 100%;
      padding: 12px;
      border-radius: 6px;
      border: 1px solid #333;
      background-color: #222;
      color: #fff;
      box-sizing: border-box;
      font-size: 15px;
      margin-bottom: 15px;
    }
    
    /* Botões de Navegação */
    .nav-buttons {
      display: flex;
      gap: 10px;
      margin-top: 20px;
    }
    .btn {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      font-size: 15px;
      cursor: pointer;
    }
    .btn-next { background-color: #4CAF50; color: white; }
    .btn-prev { background-color: #444; color: white; }
    .btn:disabled { background-color: #222; color: #666; cursor: not-allowed; }

    .hidden { display: none !important; }
  </style>
</head>
<body>

  <!-- RESUMO SUPERIOR FIXO -->
  <div id="summary-header">
    <h3>📜 Progresso da Criação</h3>
    <div class="summary-grid">
      <div class="summary-item">
        <span>🧌 RAÇA</span>
        <strong id="sum-raca">Pendente</strong>
      </div>
      <div class="summary-item">
        <span>🧬 CLÃ / SUBRAÇA</span>
        <strong id="sum-cla">Pendente</strong>
      </div>
      <div class="summary-item">
        <span>🏹 CLASSE</span>
        <strong id="sum-classe">Pendente</strong>
      </div>
    </div>
  </div>

  <!-- ETAPA 1: SELEÇÃO DE RAÇA -->
  <div id="step-1" class="step-box">
    <h2 class="step-title">Etapa 1: Seleção de Raça</h2>
    <label for="select-raca">Escolha a Raça Base do seu personagem:</label>
    <select id="select-raca" onchange="selecionarRaca()">
      <option value="">-- Selecione uma Raça --</option>
      <option value="Humano 🧔🏻‍♂️">Humano 🧔🏻‍♂️👩🏻‍🦱</option>
      <option value="Elfo 🧝🏼‍♂️">Elfo 🧝🏼‍♂️🧝🏻‍♂️</option>
      <option value="Orc 👹">Orc 👹</option>
      <option value="Bestial 🐺">Bestial 🐺</option>
      <option value="Anão 🧙‍♂️">Anão 🧙‍♂️🧙🏻</option>
      <option value="Reptiliano 🐊">Reptiliano 🐊</option>
      <option value="Tiefling 👿">Tiefling 👿</option>
      <option value="Centauro 🐎">Centauro 🐎</option>
      <option value="Yuan-ti 🐍">Yuan-ti 🐍</option>
      <option value="Goblin 🧌">Goblin 🧌</option>
      <option value="Fada 🧚‍♀️">Fada 🧚‍♀️</option>
      <option value="Insectoide 🦗">Insectoide 🦗</option>
      <option value="Dracônico 🐲">Dracônico 🐲</option>
      <option value="Ikki 🦅">Ikki 🦅</option>
      <option value="Aquafolk 🦈">Aquafolk 🦈</option>
      <option value="Neko 🐯">Neko 🐯</option>
      <option value="Boskobo 🌱">Boskobo 🌱</option>
      <option value="Gnomo 🪨">Gnomo 🪨</option>
      <option value="Mutante 🧬">Mutante 🧬</option>
      <option value="Gigante 👣">Gigante 👣</option>
    </select>
    
    <div class="nav-buttons">
      <button class="btn btn-next" id="btn-step1" onclick="proximoPasso(2)" disabled>Avançar ➡️</button>
    </div>
  </div>

  <!-- ETAPA 2: SELEÇÃO DE CLÃ / SUBRAÇA -->
  <div id="step-2" class="step-box hidden">
    <h2 class="step-title">Etapa 2: Clã / Subraça</h2>
    <label for="select-cla">Escolha o Clã ou Subraça:</label>
    <select id="select-cla" onchange="selecionarCla()">
      <option value="">-- Selecione primeiro a raça --</option>
    </select>

    <div class="nav-buttons">
      <button class="btn btn-prev" onclick="passoAnterior(1)">⬅️ Voltar</button>
      <button class="btn btn-next" id="btn-step2" onclick="proximoPasso(3)" disabled>Avançar ➡️</button>
    </div>
  </div>

  <!-- ETAPA 3: SELEÇÃO DE CLASSE -->
  <div id="step-3" class="step-box hidden">
    <h2 class="step-title">Etapa 3: Seleção de Classe</h2>
    
    <label for="select-categoria">Categoria de Classe:</label>
    <select id="select-categoria" onchange="carregarClasses()">
      <option value="fisica">🗡️ Classes Físicas</option>
      <option value="magica">🔮 Classes Mágicas</option>
      <option value="hibrida">☯️ Classes Híbridas & Especiais</option>
    </select>

    <label for="select-classe">Classe:</label>
    <select id="select-classe" onchange="selecionarClasse()">
      <option value="">-- Selecione uma Classe --</option>
    </select>

    <div class="nav-buttons">
      <button class="btn btn-prev" onclick="passoAnterior(2)">⬅️ Voltar</button>
      <button class="btn btn-next" id="btn-step3" onclick="alert('Raça, Clã e Classe configurados!')" disabled>Próxima Etapa ➡️</button>
    </div>
  </div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.expand();

    // Mapeamento dinâmico de Subraças / Clãs por Raça Oficial
    const clasPorRaca = {
      "Humano 🧔🏻‍♂️": ["Humano Comum", "Nobre Imperial", "Nômade / Tribal"],
      "Elfo 🧝🏼‍♂️": ["Elfo da Floresta", "Alto Elfo", "Elfo Negro (Drow)"],
      "Orc 👹": ["Orc Guerreador", "Orc Xamânico", "Meio-Orc"],
      "Bestial 🐺": ["Clã Canino", "Clã Felino", "Clã Ursino"],
      "Anão 🧙‍♂️": ["Anão das Montanhas", "Anão Forgeiro"],
      "Reptiliano 🐊": ["Reptiliano de Couro Duro", "Reptiliano Venenoso"],
      "Tiefling 👿": ["Sangue Abissal", "Sangue Infernal"],
      "Centauro 🐎": ["Centauro Guerreiro", "Centauro Nômade"],
      "Yuan-ti 🐍": ["Yuan-ti Puro", "Yuan-ti Mestiço"],
      "Goblin 🧌": ["Goblin das Cavernas", "Goblin Inventor"],
      "Fada 🧚‍♀️": ["Fada da Luz", "Fada da Natureza"],
      "Insectoide 🦗": ["Insectoide Blindado", "Insectoide Voador"],
      "Dracônico 🐲": ["Dracônico Vermelho (Fogo)", "Dracônico Azul (Raio)", "Dracônico Branco (Gelo)"],
      "Ikki 🦅": ["Ikki dos Picos", "Ikki Caçador"],
      "Aquafolk 🦈": ["Aquafolk das Profundezas", "Aquafolk Coral"],
      "Neko 🐯": ["Neko Ágil", "Neko Místico"],
      "Boskobo 🌱": ["Boskobo Guardião", "Boskobo Botânico"],
      "Gnomo 🪨": ["Gnomo das Rochas", "Gnomo Mecânico"],
      "Mutante 🧬": ["Mutante Físico", "Mutante Elemental"],
      "Gigante 👣": ["Gigante da Montanha", "Gigante dos Vales"]
    };

    const classesData = {
      fisica: ["Guerreiro", "Espadachim", "Cavaleiro", "Escudeiro", "Atirador", "Ladino", "Assassino", "Trapaceiro", "Lutador", "Bárbaro", "Bucaneiro"],
      magica: ["Mago", "Feiticeiro", "Bardo", "Telepata", "Necromante", "Sacerdote", "Druida", "Joker", "Infernalista", "Monge"],
      hibrida: ["Shinobi", "Guerreiro Rúnico", "Paladino / Algoz", "Mestre de Armas", "Caçador de Aberrações", "Acadêmico", "Ruptor / Vagante"]
    };

    let racaEscolhida = "";
    let claEscolhido = "";
    let classeEscolhida = "";

    function selecionarRaca() {
      racaEscolhida = document.getElementById("select-raca").value;
      const btn = document.getElementById("btn-step1");
      const sumRaca = document.getElementById("sum-raca");

      if (racaEscolhida) {
        sumRaca.textContent = racaEscolhida;
        btn.disabled = false;
        carregarClas(racaEscolhida);
      } else {
        sumRaca.textContent = "Pendente";
        btn.disabled = true;
      }
    }

    function carregarClas(raca) {
      const selectCla = document.getElementById("select-cla");
      selectCla.innerHTML = '<option value="">-- Selecione um Clã / Subraça --</option>';

      const clas = clasPorRaca[raca] || ["Subraça Padrão"];
      clas.forEach(c => {
        let opt = document.createElement("option");
        opt.value = c;
        opt.textContent = c;
        selectCla.appendChild(opt);
      });

      claEscolhido = "";
      document.getElementById("sum-cla").textContent = "Pendente";
      document.getElementById("btn-step2").disabled = true;
    }

    function selecionarCla() {
      claEscolhido = document.getElementById("select-cla").value;
      const btn = document.getElementById("btn-step2");
      const sumCla = document.getElementById("sum-cla");

      if (claEscolhido) {
        sumCla.textContent = claEscolhido;
        btn.disabled = false;
      } else {
        sumCla.textContent = "Pendente";
        btn.disabled = true;
      }
    }

    function carregarClasses() {
      const cat = document.getElementById("select-categoria").value;
      const selectClasse = document.getElementById("select-classe");
      selectClasse.innerHTML = '<option value="">-- Selecione uma Classe --</option>';

      classesData[cat].forEach(c => {
        let opt = document.createElement("option");
        opt.value = c;
        opt.textContent = c;
        selectClasse.appendChild(opt);
      });

      classeEscolhida = "";
      document.getElementById("sum-classe").textContent = "Pendente";
      document.getElementById("btn-step3").disabled = true;
    }

    function selecionarClasse() {
      classeEscolhida = document.getElementById("select-classe").value;
      const btn = document.getElementById("btn-step3");
      const sumClasse = document.getElementById("sum-classe");

      if (classeEscolhida) {
        sumClasse.textContent = classeEscolhida;
        btn.disabled = false;
      } else {
        sumClasse.textContent = "Pendente";
        btn.disabled = true;
      }
    }

    function proximoPasso(passo) {
      document.getElementById("step-1").classList.add("hidden");
      document.getElementById("step-2").classList.add("hidden");
      document.getElementById("step-3").classList.add("hidden");

      document.getElementById(`step-${passo}`).classList.remove("hidden");

      if (passo === 3) {
        carregarClasses();
      }
    }

    function passoAnterior(passo) {
      document.getElementById("step-1").classList.add("hidden");
      document.getElementById("step-2").classList.add("hidden");
      document.getElementById("step-3").classList.add("hidden");

      document.getElementById(`step-${passo}`).classList.remove("hidden");
    }
  </script>
</body>
</html>
