<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Criação de Personagem - RPG</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #121212;
      color: #ffffff;
      padding: 15px;
      margin: 0;
    }

    /* Resumo Superior Fixo */
    #summary-header {
      position: sticky;
      top: 0;
      background: #1e1e1e;
      border: 1px solid #333;
      border-radius: 8px;
      padding: 10px;
      margin-bottom: 15px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
      z-index: 100;
    }
    #summary-header h3 {
      margin: 0 0 6px 0;
      font-size: 12px;
      color: #ffca28;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .summary-grid {
      display: flex;
      justify-content: space-between;
      gap: 6px;
    }
    .summary-item {
      background: #2a2a2a;
      padding: 6px;
      border-radius: 6px;
      flex: 1;
      text-align: center;
    }
    .summary-item span {
      display: block;
      font-size: 10px;
      color: #aaa;
    }
    .summary-item strong {
      color: #4CAF50;
      font-size: 11px;
    }

    /* Estilos das Etapas */
    .step-title {
      color: #ffca28;
      text-align: center;
      margin-bottom: 15px;
      font-size: 18px;
    }
    .step-box {
      background: #181818;
      border: 1px solid #2a2a2a;
      padding: 15px;
      border-radius: 8px;
    }
    label {
      font-weight: bold;
      display: block;
      margin-bottom: 8px;
      color: #ddd;
    }
    select {
      width: 100%;
      padding: 12px;
      border-radius: 6px;
      border: 1px solid #333;
      background-color: #222;
      color: #fff;
      box-sizing: border-box;
      font-size: 15px;
      margin-bottom: 15px;
    }

    /* Cards Informativos Dinâmicos */
    .info-card {
      background: #222;
      border-left: 4px solid #ffca28;
      padding: 12px;
      border-radius: 6px;
      margin-bottom: 15px;
      font-size: 13px;
      line-height: 1.5;
    }
    .info-card p { margin: 6px 0; }
    .info-card strong { color: #ffca28; }
    .highlight-box {
      background: #2a2400;
      border: 1px solid #ffca28;
      color: #ffe082;
      padding: 8px 10px;
      border-radius: 6px;
      margin-top: 10px;
    }
    .highlight-box ul {
      margin: 4px 0 0 18px;
      padding: 0;
    }

    /* Botões de Navegação */
    .nav-buttons {
      display: flex;
      gap: 10px;
      margin-top: 15px;
    }
    .btn {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      font-size: 15px;
      cursor: pointer;
    }
    .btn-next { background-color: #4CAF50; color: white; }
    .btn-prev { background-color: #444; color: white; }
    .btn:disabled { background-color: #222; color: #666; cursor: not-allowed; }

    .hidden { display: none !important; }
  </style>
</head>
<body>

  <!-- RESUMO SUPERIOR FIXO -->

    <div class="summary-grid">

      </div>
      <div class="summary-item">

      </div>
      <div class="summary-item">

    </div>
  </div>

      <option value="Neko 🐯">Neko 🐯</option>
      <option value="Boskobo 🌱">Boskobo 🌱</option>
      <option value="Gnomo 🪨">Gnomo 🪨</option>
      <option value="Mutante 🧬">Mutante 🧬</option>
      <option value="Gigante 👣">Gigante 👣</option>

    <div id="card-raca" class="info-card hidden"></div>

    <div class="nav-buttons">
      <button class="btn btn-next" id="btn-step1" onclick="proximoPasso(2)" disabled>Avançar ➡️</button>
    </div>
  </div>

  <!-- ETAPA 2: SELEÇÃO DE CLÃ / SUBRAÇA -->
  <div id="step-2" class="step-box hidden">
    <h2 class="step-title">Etapa 2: Clã / Subraça</h2>
    <label for="select-cla">Escolha o Clã ou Subraça:</label>

    </select>

    <div id="card-cla" class="info-card hidden"></div>

    <div class="nav-buttons">
      <button class="btn btn-prev" onclick="passoAnterior(1)">⬅️ Voltar</button>
      <button class="btn btn-next" id="btn-step2" onclick="proximoPasso(3)" disabled>Avançar ➡️</button>
    </div>
  </div>

  <!-- ETAPA 3: SELEÇÃO DE CLASSE -->

    </div>
  </div>

          descricao: "Os Guerreiros são mestres absolutos do combate corpo a corpo e versáteis no uso de diversas armas, incluindo espadas, machados, maças e lanças. Conhecidos por sua força bruta inabalável e pela habilidade de enfrentar múltiplos inimigos ao mesmo tempo.",
          sugeridas: ["Maestria com Arma", "Força", "Resistência Física", "Destreza"],
          mecanicaNome: "Estilos de Combate",
          caminhos: {
            "Caminho do Mestre de Armas": "Começa com Maestria Universal (metade do nível se aplica a qualquer arma).",
            "Caminho do Destruidor de Exércitos": "Bônus na maestria equivalente a metade do nível de Força.",
            "Caminho da Dança das Lâminas": "Bônus de 1.3x em Destreza e Reflexos contra 2 ou mais inimigos."
          }
        }
      },
      magica: {
        "Mago": {
          descricao: "Estudiosos profundos das leis arcanas que canalizam mana para conjurar feitiços elementais e de suporte.",
          sugeridas: ["Conhecimento Arcano", "Bola de Fogo", "Escudo Arcano"],
          mecanicaNome: "Escola Arcana",
          caminhos: {
            "Evocação": "Aumenta o dano de magias elementais em área.",
            "Encantamento": "Aumenta a duração e potência de escudos e utilitários."
          }
        }
      },
      hibrida: {
        "Shinobi": {
          descricao: "Agentes das sombras que mesclam artes corporais com a energia dos Jutsus e Selos de Mão.",
          sugeridas: ["Maestria em Selos de Mão", "Ninjutsu", "Senjutsu", "Hankyūaku"],
          mecanicaNome: "Estilo Ninja Inicial",
          caminhos: {
            "Taijutsu + Kenjutsu": "Luta corpo a corpo combinada com uso de lâminas.",
            "Taijutsu + Bukijutsu": "Luta corporal e arremesso de armas ninjas (Kunais e Shurikens)."
          }
        }
      }
    };

    let racaEscolhida = "";
    let claEscolhido = "";
    let classeEscolhida = "";
    let caminhoEscolhido = "";

    function selecionarRaca() {
      racaEscolhida = document.getElementById("select-raca").value;
      const card = document.getElementById("card-raca");
      const btn = document.getElementById("btn-step1");
      const sumRaca = document.getElementById("sum-raca");

      if (racaEscolhida && racasDB[racaEscolhida]) {
        const info = racasDB[racaEscolhida];
        sumRaca.textContent = racaEscolhida;

        card.innerHTML = `
          <p>⏳ <strong>Expectativa de Vida:</strong> ${info.expectativa}</p>
          <p>📏 <strong>Peso e Altura:</strong> ${info.pesoAltura}</p>
          <p>📝 <strong>Descrição:</strong> ${info.descricao}</p>
          <div class="highlight-box">✨ <strong>B.R (Bônus Racial Base):</strong> ${info.br}</div>
        `;
        card.classList.remove("hidden");
        btn.disabled = false;

        carregarClas(racaEscolhida);
      } else {
        sumRaca.textContent = "Pendente";
        card.classList.add("hidden");
        btn.disabled = true;
      }
    }

    function carregarClas(racaKey) {
      const selectCla = document.getElementById("select-cla");
      selectCla.innerHTML = '<option value="">-- Selecione um Clã / Subraça --</option>';

      if (racasDB[racaKey] && racasDB[racaKey].clas) {
        Object.keys(racasDB[racaKey].clas).forEach(c => {
          let opt = document.createElement("option");
          opt.value = c;
          opt.textContent = c;
          selectCla.appendChild(opt);
        });
      }

      claEscolhido = "";
      document.getElementById("sum-cla").textContent = "Pendente";
      document.getElementById("card-cla").classList.add("hidden");
      document.getElementById("btn-step2").disabled = true;
    }

    function selecionarCla() {
      claEscolhido = document.getElementById("select-cla").value;
      const card = document.getElementById("card-cla");
      const btn = document.getElementById("btn-step2");
      const sumCla = document.getElementById("sum-cla");

      if (racaEscolhida && claEscolhido && racasDB[racaEscolhida].clas[claEscolhido]) {
        const info = racasDB[racaEscolhida].clas[claEscolhido];
        sumCla.textContent = claEscolhido;

        card.innerHTML = `
          <p>🐾 <strong>Características:</strong> ${info.caracteristicas}</p>
          <div class="highlight-box">✨ <strong>B.R do Clã:</strong> ${info.br}</div>
        `;
        card.classList.remove("hidden");
        btn.disabled = false;
      } else {
        sumCla.textContent = "Pendente";
        card.classList.add("hidden");
        btn.disabled = true;
      }
    }

    function carregarClasses() {
      const cat = document.getElementById("select-categoria").value;
      const selectClasse = document.getElementById("select-classe");
      selectClasse.innerHTML = '<option value="">-- Selecione uma Classe --</option>';

      if (classesDB[cat]) {
        Object.keys(classesDB[cat]).forEach(c => {
          let opt = document.createElement("option");
          opt.value = c;
          opt.textContent = c;
          selectClasse.appendChild(opt);
        });
      }

      classeEscolhida = "";
      document.getElementById("sum-classe").textContent = "Pendente";
      document.getElementById("card-classe").classList.add("hidden");
      document.getElementById("wrapper-mecanica-classe").classList.add("hidden");
      document.getElementById("btn-step3").disabled = true;
    }

    function selecionarClasse() {
      const cat = document.getElementById("select-categoria").value;
      classeEscolhida = document.getElementById("select-classe").value;
      const card = document.getElementById("card-classe");
      const sumClasse = document.getElementById("sum-classe");
      const wrapMecanica = document.getElementById("wrapper-mecanica-classe");
      const selectMecanica = document.getElementById("select-mecanica-classe");

      if (classeEscolhida && classesDB[cat][classeEscolhida]) {
        const info = classesDB[cat][classeEscolhida];
        sumClasse.textContent = classeEscolhida;

        let sugHTML = info.sugeridas.map(s => `<li>${s}</li>`).join("");

        card.innerHTML = `
          <p>📜 <strong>Descrição:</strong> ${info.descricao}</p>
          <div class="highlight-box">
            💡 <strong>Habilidades Sugeridas:</strong>
            <ul>${sugHTML}</ul>
          </div>
        `;
        card.classList.remove("hidden");

        selectMecanica.innerHTML = '<option value="">-- Escolha um Caminho --</option>';
        if (info.caminhos) {
          Object.keys(info.caminhos).forEach(cam => {
            let opt = document.createElement("option");
            opt.value = cam;
            opt.textContent = cam;
            selectMecanica.appendChild(opt);
          });
          wrapMecanica.classList.remove("hidden");
        } else {
          wrapMecanica.classList.add("hidden");
        }

        verificarAvancoStep3();
      } else {
        sumClasse.textContent = "Pendente";
        card.classList.add("hidden");
        wrapMecanica.classList.add("hidden");
        document.getElementById("btn-step3").disabled = true;
      }
    }

    function selecionarMecanicaClasse() {
      const cat = document.getElementById("select-categoria").value;
      caminhoEscolhido = document.getElementById("select-mecanica-classe").value;
      const cardDet = document.getElementById("card-mecanica-detalhes");

      if (classeEscolhida && caminhoEscolhido && classesDB[cat][classeEscolhida].caminhos[caminhoEscolhido]) {
        const desc = classesDB[cat][classeEscolhida].caminhos[caminhoEscolhido];
        cardDet.innerHTML = `<p>⚡ <strong>Efeito do Caminho:</strong> ${desc}</p>`;
        cardDet.classList.remove("hidden");
      } else {
        cardDet.classList.add("hidden");
      }

      verificarAvancoStep3();
    }

    function verificarAvancoStep3() {
      const btn = document.getElementById("btn-step3");
      const cat = document.getElementById("select-categoria").value;
      
      if (classeEscolhida) {
        const info = classesDB[cat][classeEscolhida];
        if (info.caminhos) {
          btn.disabled = !caminhoEscolhido;
        } else {
          btn.disabled = false;
        }
      } else {
        btn.disabled = true;
      }
    }

    function proximoPasso(passo) {
      document.getElementById("step-1").classList.add("hidden");
      document.getElementById("step-2").classList.add("hidden");
      document.getElementById("step-3").classList.add("hidden");

      document.getElementById(`step-${passo}`).classList.remove("hidden");

      if (passo === 3) {
        carregarClasses();
      }
    }

    function passoAnterior(passo) {
      document.getElementById("step-1").classList.add("hidden");
      document.getElementById("step-2").classList.add("hidden");
      document.getElementById("step-3").classList.add("hidden");

      document.getElementById(`step-${passo}`).classList.remove("hidden");
    }
  </script>
</body>
</html>
